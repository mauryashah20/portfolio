<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Maurya Shah</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Projects page of Maurya Shah - embedded networks, IoT hardware development, full-stack websites, and experiments.">
</head>
<body>
    <canvas id="embers-canvas"></canvas>
    <nav class="navbar" id="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">Maurya.</a>
            <div class="nav-links" id="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="projects.html" class="nav-item">Projects</a>
                <a href="contact.html" class="nav-item">Contact</a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main style="padding-top: 80px;">
        <section id="projects" class="section padding-y fade-in is-visible">
            <div class="section-container">
                <div class="section-header">
                    <h2 class="section-title">Development Projects</h2>
                    <div class="line"></div>
                </div>

                <div class="project-filters" id="project-filters">
                    <button class="filter-btn active" data-filter="all">
                        <span>All</span>
                        <span class="count-badge" id="count-all">0</span>
                    </button>
                    <button class="filter-btn" data-filter="website">
                        <span class="category-indicator indicator-web"></span>
                        <span>Websites</span>
                        <span class="count-badge" id="count-website">0</span>
                    </button>
                    <button class="filter-btn" data-filter="iot">
                        <span class="category-indicator indicator-iot"></span>
                        <span>IoT & Embedded</span>
                        <span class="count-badge" id="count-iot">0</span>
                    </button>
                    <button class="filter-btn" data-filter="hobby">
                        <span class="category-indicator indicator-hobby"></span>
                        <span>Hobby & Labs</span>
                        <span class="count-badge" id="count-hobby">0</span>
                    </button>
                </div>

                <div id="project-grid-container" class="project-grid"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p style="color: var(--text-secondary);">&copy; 2026 Maurya Shah | Portfolio</p>
        </div>
    </footer>

    <script src="projects-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
